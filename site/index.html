<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زندگی خورشید</title>
<meta name="description" content="در گذر ده میلیارد سال، تولد خورشید، گسترش و خاموشی‌اش را تماشا کنید.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:Vazirmatn,Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;top:63.2%;display:grid;justify-items:center;padding:0 20px;pointer-events:none}
.cap{position:relative;width:100%;height:54px}
.line{position:absolute;inset:0;text-align:center;direction:rtl;transition:opacity .2s linear,filter .2s linear}
.line.off{opacity:0;filter:blur(5px)}
.line h1{font-weight:600;font-size:clamp(16px,2.05vh,21px);letter-spacing:-.012em;line-height:1.25}
.line p{margin-top:6px;font-size:clamp(12.5px,1.55vh,15px);line-height:1.3;color:rgba(255,255,255,.5)}
.line p b{font-weight:500;color:#fff;margin-right:7px}
#track{position:relative;width:min(47vh,84vw);height:64px;margin-top:clamp(14px,3.2vh,30px);pointer-events:auto;cursor:pointer;outline:none}
#track::before{content:"";position:absolute;inset:-8px -30px}
#ticks{position:absolute;left:0;right:0;top:0;height:44px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#ticks i{display:block;width:1.5px;height:44px;background:#fff;transform-origin:50% 100%;will-change:transform}
.ends{position:absolute;left:0;right:0;top:54px;display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,.42);pointer-events:none}
.ends span.on{color:#fff;font-weight:500}
.credit{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11px;line-height:1.4;color:rgba(255,255,255,.34);pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="ui">
  <div class="cap" id="cap"></div>
  <div id="track" role="slider" tabindex="0" aria-label="زمان" aria-valuemin="۰" aria-valuemax="۹">
    <div id="ticks"></div>
    <div class="ends"><span id="e0">سحابی</span><span id="e1">کوتولهٔ سفید</span></div>
  </div>
</div>
<footer class="credit">سازنده: <bdi dir="ltr">taha zolghadr</bdi></footer>
<script>
'use strict';
const STAGES = [
  {t: '۴٫۶ میلیارد سال پیش', b: 'سحابی خورشیدی', c: 'ابر سردی به‌سوی درون فرومی‌ریزد'},
  {t: '۴٫۵۷ میلیارد سال پیش', b: 'پیش‌ستاره', c: 'گرانش، هسته‌ای جوان را داغ می‌کند'},
  {t: '۴٫۵ میلیارد سال پیش', b: 'آغاز همجوشی', c: 'سوزاندن هیدروژن آغاز می‌شود'},
  {t: 'امروز', b: 'خورشید', c: 'در میانهٔ عمر خود'},
  {t: '۱ میلیارد سال دیگر', b: 'خورشیدِ درخشان‌تر', c: 'اقیانوس‌ها به جوش می‌آیند'},
  {t: '۵ میلیارد سال دیگر', b: 'زیرغول', c: 'سوخت هسته به پایان می‌رسد'},
  {t: '۷٫۶ میلیارد سال دیگر', b: 'غول سرخ', c: 'خورشید عطارد را می‌بلعد'},
  {t: '۷٫۷ میلیارد سال دیگر', b: 'جرقهٔ هلیومی', c: 'هسته دوباره شعله‌ور می‌شود'},
  {t: '۷٫۸ میلیارد سال دیگر', b: 'سحابی سیاره‌نما', c: 'لایه‌های بیرونی پراکنده می‌شوند'},
  {t: '۸ میلیارد سال دیگر', b: 'کوتولهٔ سفید', c: 'اخگری به‌اندازهٔ زمین'}
];
// one look per stage; every stage is the same ball. colours are linear and tone-mapped in the shader
const LOOK = [
  {c0: [.05,.01,.1],   c1: [.62,.12,.42], c2: [1.9,.85,.5],  glow: [.8,.25,.6],  gI: .22, freq: 2.6, warp: 1.9, cells: 0,  gas: 1,  shell: 0,  boil: 1},
  {c0: [.015,.004,0],  c1: [.62,.05,.01], c2: [3,1.1,.15],   glow: [1.3,.2,.04], gI: .28, freq: 3.1, warp: 1.2, cells: 1,  gas: 0,  shell: 0,  boil: .7},
  {c0: [.5,.05,0],     c1: [1.7,.48,.03], c2: [3.2,2,.55],   glow: [1.6,.5,.06], gI: .85, freq: 4.6, warp: 1.6, cells: .3, gas: 0,  shell: 0,  boil: 1.5},
  {c0: [1,.26,.01],    c1: [2.3,1,.12],   c2: [3.6,2.9,1.3], glow: [1.8,.68,.1], gI: 1,   freq: 3.4, warp: 1.1, cells: 0,  gas: 0,  shell: 0,  boil: 1.1},
  {c0: [1.5,.72,.2],   c1: [3,2.1,.8],    c2: [4.6,4.3,3.4], glow: [1.9,1.2,.5], gI: 1.2, freq: 3.8, warp: 1.1, cells: 0,  gas: 0,  shell: 0,  boil: 1.3},
  {c0: [.6,.1,.005],   c1: [1.8,.5,.03],  c2: [3,1.5,.25],   glow: [1.7,.42,.05],gI: .9,  freq: 3,   warp: 1.6, cells: .15,gas: 0,  shell: 0,  boil: 1.2},
  {c0: [.22,.008,.003],c1: [1.25,.1,.015],c2: [3,.95,.1],    glow: [1.8,.16,.03],gI: .85, freq: 2,   warp: 2.1, cells: .35,gas: 0,  shell: 0,  boil: 1.4},
  {c0: [1.6,.8,.3],    c1: [4,3,1.4],     c2: [8,7,5.5],     glow: [2.4,1.6,.8], gI: 1.7, freq: 3.2, warp: 2,   cells: 0,  gas: 0,  shell: 0,  boil: 3},
  {c0: [.02,.09,.12],  c1: [.1,.7,.72],   c2: [1.8,.42,.16], glow: [.3,.7,.8],   gI: .3,  freq: 3.4, warp: 1.5, cells: 0,  gas: .75,shell: 1,  boil: .9},
  {c0: [.8,1,1.5],     c1: [1.7,2.1,3],   c2: [3.6,4.2,5.4], glow: [.8,1.2,2.1], gI: .9,  freq: 2.6, warp: .8,  cells: 0,  gas: 0,  shell: 0,  boil: .5}
];
const LAST = STAGES.length - 1, PER = 4, N = LAST * PER + 1, START = 3;
const vertexSource = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const fragmentSource = `precision highp float;
  uniform vec2 res;
  uniform float sc, rad, cy, fade, t, evo, rot, blur, starX, freq, warp, cells, gas, shell, gI, flick;
  uniform vec3 c0, c1, c2, glow;
  float h(vec3 p){ p = fract(p*.3183099 + .1); p *= 17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x), mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x), f.y),
               mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x), mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x), f.y), f.z); }
  float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*n3(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
  vec3 stars(vec2 uv){
    vec2 q = (uv + vec2(starX, 0.))*34., id = floor(q), f = fract(q)-.5;
    float r = fract(sin(dot(id,vec2(127.1,311.7)))*43758.5453);
    vec2 o = vec2(fract(r*17.3),fract(r*91.7))-.5;
    float tw = .55+.45*sin(t*(.7+r*1.8)+r*40.);
    vec2 g = f-o*.7; g.x *= 1./(1.+blur*7.);
    return vec3(smoothstep(.975,1.,r)*smoothstep(.06,.0,length(g))*tw*.55);
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*res)/res.y, p = (uv - vec2(0., cy))/sc;
    float d = length(p), e = max(d-rad, 0.);
    vec3 col = stars(uv);

    // tight halo that ends completely a short way off the ball, the page stays pure black
    vec2 dir = p/max(d,1e-4);
    float rays = .72 + .56*fbm(vec3(dir*2.4, evo*.5));
    float hal = exp(-e/(rad*.11))*smoothstep(rad*.6, rad*.12, e);
    col += glow*gI*.7*hal*rays*flick;

    // soft pool of light under the ball, standing in for the reference's contact shadow
    float py = (p.y + rad + .065)/.0135, px = p.x/(rad*1.02);
    float pool = max(0., 1.-px*px) * exp(-py*py);
    col += glow*min(gI,1.)*.1*pool*pool;

    if(d < rad + .02){
      float k = min(d/rad, 1.);
      vec3 nrm = vec3(p/rad, sqrt(max(1.-k*k, 0.)));
      float cr = cos(rot), sr = sin(rot);
      vec3 n = vec3(nrm.x*cr + nrm.z*sr, nrm.y, -nrm.x*sr + nrm.z*cr);
      // spinning fast smears the surface along its axis of rotation
      float sq = 1./(1.+blur*3.2);
      vec3 q = vec3(n.x*sq, n.y, n.z*sq);
      float w1 = fbm(q*freq + vec3(0.,0.,evo*.28)), w2 = fbm(q*freq*.9 + 7. - vec3(evo*.22,0.,0.));
      float v = fbm(q*freq*1.7 + warp*2.2*vec3(w1, w2, w1-w2));
      float vein = 1.-abs(2.*fbm(q*freq*1.5 + warp*1.3*vec3(w2, w1, 0.))-1.);
      vein = pow(vein, 9.);
      float s = smoothstep(.24,.76,v);
      s = mix(s, clamp(vein*1.25 + s*.14,0.,1.), cells);
      vec3 c = mix(c0, c1, smoothstep(.0,.55,s));
      c = mix(c, c2, smoothstep(.5,1.,s));
      float mu = nrm.z;
      if(shell > .001){
        // planetary nebula: a hot point, a teal cavity and a filament shell seen through the ball
        vec3 sh = c0 + c1*smoothstep(.95,.3,k)*(.25+v*1.2);
        float fil = smoothstep(.5,.82,k)*smoothstep(1.,.8,k)*pow(v+.32,3.)*3.2;
        sh += c2*fil + vec3(3.5,4.,5.)*exp(-k*k/.012);
        c = mix(c, sh, shell);
      } else {
        c *= mix(mix(.34, .8, gas), 1., pow(mu,.5));
      }
      c += glow*pow(1.-mu,2.6)*.42*min(gI,1.)*(1.-gas);
      float edge = smoothstep(1., .985, k);
      float soft = smoothstep(1., .58, k + (fbm(q*3.4 + evo*.1)-.5)*.62) * smoothstep(1., .9, k);
      float a = mix(edge, soft, gas);
      col = mix(col, c, a);
    }
    col = 1. - exp(-col*1.15);
    gl_FragColor = vec4(pow(col, vec3(.4545))*fade, 1.);
  }`;
const canvas = document.getElementById('gl'), gl = canvas.getContext('webgl', {antialias:false, alpha:false});
if (!gl) { document.body.innerHTML = '<p style="padding:2rem">WebGL is not available in this browser.</p>'; throw new Error('WebGL unavailable'); }
function shader(type, source) { const s=gl.createShader(type); gl.shaderSource(s,source); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const program=gl.createProgram(); gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource)); gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource)); gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const buffer=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buffer); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const aLoc=gl.getAttribLocation(program,'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc,2,gl.FLOAT,false,0,0);
const U={}; for(const name of ['res','sc','rad','cy','fade','t','evo','rot','blur','starX','freq','warp','cells','gas','shell','gI','flick','c0','c1','c2','glow']) U[name]=gl.getUniformLocation(program,name);
let sc=1;
function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5); canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr); gl.viewport(0,0,canvas.width,canvas.height); sc=Math.min(1,innerWidth/innerHeight*1.5);}
window.addEventListener('resize',resize); resize();
const ticksEl=document.getElementById('ticks'), cap=document.getElementById('cap'), track=document.getElementById('track'), e0=document.getElementById('e0'), e1=document.getElementById('e1');
ticksEl.innerHTML=Array.from({length:N},()=>'<i></i>').join(''); const tickEls=[...ticksEl.children], tickH=Array(N).fill(.17);
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let x=START/LAST, stage=START, omega=14, rot=0, evo=0, starX=0, lastInput=-1e9, hover=-1, dragX=null, cur={...LOOK[START],c0:[...LOOK[START].c0],c1:[...LOOK[START].c1],c2:[...LOOK[START].c2],glow:[...LOOK[START].glow]};
const t0=performance.now(); let nextAuto=t0+5000;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function moveTo(nx,now=performance.now()){nx=clamp(nx);omega+=(nx-x)*150;x=nx;lastInput=now;}
function px(e){const r=track.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width);}
function setCaption(i){const prev=cap.lastElementChild;const s=STAGES[i];const node=document.createElement('div');node.className='line off';node.innerHTML=`<h1>${s.t}</h1><p><b>${s.b}</b>${s.c}</p>`;cap.appendChild(node);void node.offsetWidth;node.classList.remove('off');if(prev){prev.classList.add('off');setTimeout(()=>prev.remove(),240);}track.setAttribute('aria-valuenow',new Intl.NumberFormat('fa-IR').format(i));track.setAttribute('aria-valuetext',`${s.t}: ${s.b}. ${s.c}`);e0.classList.toggle('on',i===0);e1.classList.toggle('on',i===LAST);}
setCaption(START);
window.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;moveTo(x+d*(e.deltaMode===1?.012:.00075));},{passive:false});
track.addEventListener('pointermove',e=>{hover=px(e);if(e.pointerType==='mouse'&&dragX===null)moveTo(hover);});track.addEventListener('pointerleave',()=>{hover=-1;});
window.addEventListener('pointerdown',e=>{dragX=e.clientX;if(track.contains(e.target))moveTo(px(e));});
window.addEventListener('pointermove',e=>{if(dragX!==null){if(track.contains(e.target))moveTo(px(e));else moveTo(x+(e.clientX-dragX)/Math.min(innerWidth,900));dragX=e.clientX;}});
window.addEventListener('pointerup',()=>{dragX=null;});window.addEventListener('pointercancel',()=>{dragX=null;});
track.addEventListener('keydown',e=>{let i=Math.round(x*LAST);if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();moveTo(Math.min(LAST,i+1)/LAST);}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();moveTo(Math.max(0,i-1)/LAST);}});
let previous=t0;
function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;const ease=r=>1-Math.exp(-dt*r),time=(now-t0)/1000;
 if(!reduced.matches&&now-lastInput>5000&&now>nextAuto){const i=Math.round(x*LAST);x=((i+1)%(LAST+1))/LAST;omega+=9;nextAuto=now+2600;}
 const i=Math.round(x*LAST);if(i!==stage){omega+=omega>=0?7:-7;stage=i;setCaption(i);}
 const target=LOOK[stage], f=ease(reduced.matches?60:13);for(const key of ['gI','freq','warp','cells','gas','shell','boil'])cur[key]+=(target[key]-cur[key])*f;for(const key of ['c0','c1','c2','glow'])for(let k=0;k<3;k++)cur[key][k]+=(target[key][k]-cur[key][k])*f;
 omega*=Math.exp(-dt*3.6);const spin=reduced.matches?0:.22+omega, blur=Math.min(1.4,Math.abs(omega)*.1);rot+=spin*dt;evo+=dt*cur.boil*(1+Math.abs(omega)*.1);starX+=omega*dt*.012;
 gl.uniform2f(U.res,canvas.width,canvas.height);gl.uniform1f(U.sc,sc);gl.uniform1f(U.rad,.17);gl.uniform1f(U.cy,.13);gl.uniform1f(U.fade,Math.min(1,(now-t0)/500));gl.uniform1f(U.t,time);gl.uniform1f(U.evo,evo);gl.uniform1f(U.rot,rot);gl.uniform1f(U.blur,blur);gl.uniform1f(U.starX,starX);
 for(const key of ['freq','warp','cells','gas','shell','gI'])gl.uniform1f(U[key],cur[key]);for(const key of ['c0','c1','c2','glow'])gl.uniform3fv(U[key],cur[key]);gl.uniform1f(U.flick,1+.1*Math.sin(time*2.1)+.06*Math.sin(time*5.3));gl.drawArrays(gl.TRIANGLES,0,3);
 const active=x*(N-1),bellAt=(hover>=0?hover:x)*(N-1);for(let j=0;j<N;j++){const q=j-bellAt,bell=Math.exp(-q*q/5.5),on=Math.exp(-Math.pow(j-active,2)/.22),goal=Math.max((j%PER?.17:.28)+bell*.55,on);tickH[j]+=(goal-tickH[j])*ease(22);tickEls[j].style.transform=`scaleY(${tickH[j]})`;tickEls[j].style.opacity=String(.3+bell*.35+on*.6);}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
